services:
  - type: web
    name: pak-booster-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: 3001
    healthCheckPath: /health
    autoDeploy: true
